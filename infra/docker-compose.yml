services:

  # ──────────────────────────────────────────
  # PostgreSQL 16 — banco de dados principal
  # ──────────────────────────────────────────
  postgres:
    # pgvector/pgvector:pg16 = PostgreSQL 16 + extensão pgvector (exigida pelo Zep)
    # Compatível com volumes criados por postgres:16-alpine (mesma major version)
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - automacao_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # Redis 7 — cache e fila de mensagens
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - automacao_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────
  # n8n — orquestrador de fluxos
  # ──────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://${VPS_IP}:5678/
      - GENERIC_TIMEZONE=America/Manaus
      - N8N_LOG_LEVEL=warn
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automacao_net

  # ──────────────────────────────────────────
  # Zep — segundo cérebro / memória longitudinal
  # Config via arquivo (env vars ignoradas no v0.27.x)
  # ──────────────────────────────────────────
  zep:
    image: ghcr.io/getzep/zep:latest
    container_name: zep
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./zep_config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - automacao_net

  # ──────────────────────────────────────────
  # Evolution API — gateway WhatsApp
  # ──────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://${VPS_IP}:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB_NAME}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=ERROR
      - LOG_COLOR=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automacao_net

# ──────────────────────────────────────────
# Volumes persistentes
# ──────────────────────────────────────────
  # ──────────────────────────────────────────
  # Dr. João Holanda Agent — cérebro do ecossistema
  # ──────────────────────────────────────────
  joao_holanda:
    build:
      # Contexto = diretório do docker-compose.yml (/root/automacao na VPS),
      # necessário para o Dockerfile acessar agents/ e integrations/.
      context: .
      dockerfile: agents/Dockerfile
    container_name: joao_holanda_agent
    restart: always
    ports:
      - "3000:3000"
    environment:
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - WHATSAPP_INSTANCE_NAME=edilson
      - ZEP_API_URL=http://zep:8000
      - ZEP_API_KEY=${ZEP_API_KEY}
      - ZEP_SESSION_ID=${ZEP_SESSION_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      # Nvidia NIM — motor único multimodal (texto, imagem, vídeo, áudio)
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - NVIDIA_NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - NIM_CHAT_MODEL=${NIM_CHAT_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      - NIM_REASONING_BUDGET=${NIM_REASONING_BUDGET:-4096}
      - VPS_IP=${VPS_IP}
      - EDILSON_PHONE=${EDILSON_PHONE}
      - N8N_FAMILY_GROUP_WA_ID=${N8N_FAMILY_GROUP_WA_ID}
    depends_on:
      - zep
      - postgres
    networks:
      - automacao_net

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
  zep_data:

# ──────────────────────────────────────────
# Rede interna isolada
# ──────────────────────────────────────────
networks:
  automacao_net:
    driver: bridge
