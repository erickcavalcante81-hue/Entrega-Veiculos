services:

  # ──────────────────────────────────────────
  # PostgreSQL 16 — banco de dados principal
  # ──────────────────────────────────────────
  postgres:
    # pgvector/pgvector:pg16 = PostgreSQL 16 + extensão pgvector (exigida pelo Zep)
    # Compatível com volumes criados por postgres:16-alpine (mesma major version)
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - automacao_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # Redis 7 — cache e fila de mensagens
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - automacao_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────
  # n8n — orquestrador de fluxos
  # ──────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://${VPS_IP}:5678/
      - GENERIC_TIMEZONE=America/Manaus
      - N8N_LOG_LEVEL=warn
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automacao_net

  # ──────────────────────────────────────────
  # Zep — segundo cérebro / memória longitudinal
  # Config via arquivo (env vars ignoradas no v0.27.x)
  # ──────────────────────────────────────────
  zep:
    image: ghcr.io/getzep/zep:latest
    container_name: zep
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./zep_config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - automacao_net

  # ──────────────────────────────────────────
  # Evolution API — gateway WhatsApp
  # ──────────────────────────────────────────
  evolution:
    # Fixada na versão já validada nesta VPS. 'latest' num gateway de WhatsApp
    # muda o comportamento do Baileys sem aviso, no meio de um pareamento.
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://${VPS_IP}:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      # Obrigatório no Evolution v2 — sem isto o container morre em loop com
      # "Error: Database provider  invalid." (a variável vazia aparece como
      # espaço duplo na mensagem).
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-postgresql}
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB_NAME}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      # ─────────────────────────────────────────────────────────────────
      # Correção do erro "Não foi possível conectar o dispositivo"
      # (meta-issue EvolutionAPI/evolution-api#2437)
      #
      # Causa: o Baileys gera as pre-keys ao mesmo tempo em que a Meta
      # despeja o histórico da conta. O servidor satura, a geração das
      # pre-keys estoura o timeout, vem stream error 515 e o WhatsApp
      # derruba o dispositivo recém-pareado.
      #
      # Solução: desligar a sincronização de histórico e o cache Redis
      # durante a sessão, deixando o pareamento respirar.
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Versão do WhatsApp Web que o Baileys declara. Desatualizada, a Meta
      # recusa a conexão. Ajustável pelo .env quando a comunidade publicar
      # uma nova referência.
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1033773198}
      # ─────────────────────────────────────────────────────────────────
      - LOG_LEVEL=ERROR
      - LOG_COLOR=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automacao_net

# ──────────────────────────────────────────
# Volumes persistentes
# ──────────────────────────────────────────
  # ──────────────────────────────────────────
  # Dr. João Holanda Agent — cérebro do ecossistema
  # ──────────────────────────────────────────
  joao_holanda:
    build:
      # Contexto = diretório do docker-compose.yml (/root/automacao na VPS),
      # necessário para o Dockerfile acessar agents/ e integrations/.
      context: .
      dockerfile: agents/Dockerfile
    container_name: joao_holanda_agent
    restart: always
    ports:
      # A porta interna continua 3000 — é por ela que a Evolution API alcança
      # o agente pela rede Docker (http://joao_holanda_agent:3000).
      # A porta do host é configurável porque 3000 costuma estar ocupada.
      - "${AGENT_HOST_PORT:-3001}:3000"
    environment:
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - WHATSAPP_INSTANCE_NAME=edilson
      - ZEP_API_URL=http://zep:8000
      - ZEP_API_KEY=${ZEP_API_KEY}
      - ZEP_SESSION_ID=${ZEP_SESSION_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      # Motor de IA: "gemini" ou "nim". Vazio = gemini se houver GEMINI_API_KEY.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      # Google Gemini (chave do Google AI Studio — aistudio.google.com)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # Nvidia NIM — motor alternativo (texto, imagem, vídeo, áudio)
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - NVIDIA_NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - NIM_CHAT_MODEL=${NIM_CHAT_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      - NIM_REASONING_BUDGET=${NIM_REASONING_BUDGET:-4096}
      - VOZ_ALERTA_LIMIAR=${VOZ_ALERTA_LIMIAR:-3}
      - EXTRA_ALLOWED_NUMBERS=${EXTRA_ALLOWED_NUMBERS:-}
      # Protege /chat, /qrcode e /memoria/* — a porta do agente é pública
      - AGENT_ACCESS_TOKEN=${AGENT_ACCESS_TOKEN:-}
      # Canal Telegram (API oficial, sem risco de banimento)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS:-}
      # Quem pode deixar orientações permanentes de comportamento
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      # Quem é cada chat_id: "id:Nome:papel:tratamento, ..."
      - TELEGRAM_CONTATOS=${TELEGRAM_CONTATOS:-}
      - VPS_IP=${VPS_IP}
      - EDILSON_PHONE=${EDILSON_PHONE}
      - N8N_FAMILY_GROUP_WA_ID=${N8N_FAMILY_GROUP_WA_ID}
    volumes:
      # Amostras de voz do Sr. Edilson — dado biométrico do paciente.
      # Montadas como volume, fora da imagem e fora do repositório git.
      # Gravável: a página /voz escreve as amostras enviadas pelo navegador
      - ./voz:/app/voz
      # Ficha clínica e laudos do Sr. Edilson — dados de saúde
      # identificáveis, montados como volume e fora do repositório.
      - ./conhecimento:/app/conhecimento:ro
    depends_on:
      - zep
      - postgres
    networks:
      - automacao_net

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
  zep_data:

# ──────────────────────────────────────────
# Rede interna isolada
# ──────────────────────────────────────────
networks:
  automacao_net:
    driver: bridge
